[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Vedaru/pipelets"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
# Fat LTO, single codegen unit, stripped, abort on panic. Keep opt-level 2:
# "s"/"z" shrink the binary (~7.6/7.0 MB vs ~9.5 MB) but raise idle RSS by
# ~0.6/1.6 MB, which is a bad trade for a swarm (32 units). Size comes from the
# dependency set instead.
lto = "fat"
opt-level = 2
strip = true
codegen-units = 1
panic = "abort"
