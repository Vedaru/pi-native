[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Vedaru/pi-native"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
# Size and speed: fat LTO plus opt-level 2 measured smaller, lighter, and no
# slower than thin/3 (binary ~7.7 MB vs ~8.7 MB; serve idle ~5.0 MB vs ~5.8 MB).
lto = "fat"
opt-level = 2
strip = true
codegen-units = 1
panic = "abort"
