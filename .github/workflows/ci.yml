name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Headless worker gate
        run: cargo run --release -p pi-gate -- headless

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: cargo run --release -p pi-gate -- package
      - name: Smoke-test the artifact
        run: |
          mkdir -p /tmp/pkg
          tar -xzf dist/pipelets-*.tar.gz -C /tmp/pkg
          /tmp/pkg/pipelets-*/pipelets --version
          ( cd dist && sha256sum -c pipelets-*.tar.gz.sha256 )
      - uses: actions/upload-artifact@v4
        with:
          name: pipelets-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

  memory-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install benchmark targets
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.2
          curl -sL -o /tmp/pi-rust.tar.xz https://github.com/Dicklesworthstone/pi_agent_rust/releases/download/v0.7.1/pi-linux-amd64.tar.xz
          mkdir -p /tmp/pi-rust
          tar -xJf /tmp/pi-rust.tar.xz -C /tmp/pi-rust
          echo "PI_RUST_BIN=/tmp/pi-rust/pi" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build our native target
        run: |
          cargo build --release -p pipelets
          echo "PIPELETS_BIN=$PWD/target/release/pipelets" >> "$GITHUB_ENV"
      - name: Build the gate binary
        run: cargo build --release -p pi-gate
      - name: Memory regression gate
        run: |
          # Absolute baseline is a dev-machine measurement, so CI uses the
          # environment-independent ratio check (native <= 60% of Node).
          ./target/release/pi-gate mem-gate --no-absolute --ratio-threshold 0.6 --max-native-mb 25
      - name: Pressure gate (tools)
        run: ./target/release/pi-gate stress-gate --binary target/release/pipelets --turns 20000 --tools ls grep find edit read --max-mb 100 --max-cpu 5
      - name: Pressure gate (session/compaction)
        run: ./target/release/pi-gate stress-gate --binary target/release/pipelets --turns 20000 --tools read --max-mb 100 --max-cpu 5 --session
      - name: Pressure gate (image decode/resize)
        run: ./target/release/pi-gate stress-gate --binary target/release/pipelets --turns 50 --tools image --max-mb 60 --max-cpu 5 --skip-idle
      - name: Pressure gate (image retained in a session)
        run: ./target/release/pi-gate stress-gate --binary target/release/pipelets --turns 20 --tools image --max-mb 60 --max-cpu 10 --skip-idle --session --context-tokens 100000000
      - name: Swarm gate
        run: |
          ./target/release/pi-gate swarm-stress --binary target/release/pipelets --units 8 --mode idle --max-total-mb 100
          ./target/release/pi-gate swarm-stress --binary target/release/pipelets --units 8 --mode busy --turns 200000 --max-total-mb 200
