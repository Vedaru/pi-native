name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Headless worker gate
        run: python3 scripts/headless_gate.py
      - name: Swarm script unit tests
        run: |
          python3 scripts/test_swarm_conductor.py
          python3 scripts/test_swarm_orchestrator.py
          python3 scripts/test_swarm_watchdog.py
          python3 scripts/test_swarm_columns.py
          python3 scripts/test_swarm_dag.py
          python3 scripts/test_swarm_mail.py

  swarm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swarm unit tests (stdlib, no build)
        run: |
          python3 scripts/test_swarm_conductor.py
          python3 scripts/test_swarm_orchestrator.py
          python3 scripts/test_swarm_watchdog.py
          python3 scripts/test_swarm_columns.py
          python3 scripts/test_swarm_dag.py
          python3 scripts/test_swarm_collision.py
          python3 scripts/test_mem_gate.py
          python3 scripts/test_swarm_mail.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: scripts/package.sh
      - name: Smoke-test the artifact
        run: |
          mkdir -p /tmp/pkg
          tar -xzf dist/pi-native-*.tar.gz -C /tmp/pkg
          /tmp/pkg/pi-native-*/pi-native --version
          ( cd dist && sha256sum -c pi-native-*.tar.gz.sha256 )
      - uses: actions/upload-artifact@v4
        with:
          name: pi-native-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

  memory-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install benchmark targets
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.2
          curl -sL -o /tmp/pi-rust.tar.xz https://github.com/Dicklesworthstone/pi_agent_rust/releases/download/v0.7.1/pi-linux-amd64.tar.xz
          mkdir -p /tmp/pi-rust
          tar -xJf /tmp/pi-rust.tar.xz -C /tmp/pi-rust
          echo "PI_RUST_BIN=/tmp/pi-rust/pi" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build our native target
        run: |
          cargo build --release -p pi-native
          echo "PI_NATIVE_BIN=$PWD/target/release/pi-native" >> "$GITHUB_ENV"
      # Absolute baseline is a dev-machine measurement, so CI uses the
      # environment-independent ratio check (native <= 60% of Node).
      - name: Memory regression gate
        run: python3 scripts/mem_gate.py --no-absolute --ratio-threshold 0.6 --max-native-mb 25
      - name: Pressure gate (tools)
        run: python3 scripts/stress_gate.py --binary target/release/pi-native --turns 20000 --tools ls grep find edit read --max-mb 100 --max-cpu 5
      - name: Pressure gate (session/compaction)
        run: python3 scripts/stress_gate.py --binary target/release/pi-native --turns 20000 --tools read --max-mb 100 --max-cpu 5 --session
      - name: Swarm gate
        run: |
          python3 scripts/swarm_stress.py --binary target/release/pi-native --units 8 --mode idle --max-total-mb 100
          python3 scripts/swarm_stress.py --binary target/release/pi-native --units 8 --mode busy --turns 200000 --max-total-mb 200
