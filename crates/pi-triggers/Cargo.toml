[package]
name = "pi-triggers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Trigger engine: schedules, episodes, budgets, and durable run records"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
pi-host = { path = "../pi-host" }
pi-agent = { path = "../pi-agent" }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
pi-providers = { path = "../pi-providers" }
