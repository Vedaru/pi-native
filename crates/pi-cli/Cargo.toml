[package]
name = "pipelets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pipelets: a low-memory, low-CPU bare-core agent runtime for swarms, ports pi's behavior"

[[bin]]
name = "pipelets"
path = "src/main.rs"

[dependencies]
pi-cache = { path = "../pi-cache" }
pi-agent = { path = "../pi-agent" }
pi-tools = { path = "../pi-tools" }
pi-rpc = { path = "../pi-rpc" }
pi-host = { path = "../pi-host" }
pi-gateway = { path = "../pi-gateway" }
pi-triggers = { path = "../pi-triggers" }
pi-session = { path = "../pi-session" }
pi-plugins = { path = "../pi-plugins" }
pi-tui = { path = "../pi-tui" }
serde_json = { workspace = true }
clap = { workspace = true }
