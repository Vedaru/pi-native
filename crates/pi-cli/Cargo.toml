[package]
name = "pipelets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A swarm-friendly, low-memory, low-CPU agent bare core: ~4 MB per idle unit, byte-for-byte pi provider parity, no Node"

[[bin]]
name = "pipelets"
path = "src/main.rs"

[dependencies]
pi-cache = { path = "../pi-cache" }
pi-agent = { path = "../pi-agent" }
pi-tools = { path = "../pi-tools" }
pi-image = { path = "../pi-image" }
pi-rpc = { path = "../pi-rpc" }
pi-host = { path = "../pi-host" }
pi-gateway = { path = "../pi-gateway" }
pi-triggers = { path = "../pi-triggers" }
pi-plugins = { path = "../pi-plugins" }
serde_json = { workspace = true }
clap = { workspace = true }
