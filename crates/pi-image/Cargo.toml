[package]
name = "pi-image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native image decode/resize/encode for `read` attachments"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
base64 = "0.22"
kamadak-exif = "0.6"
png = { version = "0.18", default-features = false }
libjpeg-turbo-rs = "0.8"

# `malloc_trim` after a decode returns the transient to the OS.
[target.'cfg(all(unix, target_env = "gnu"))'.dependencies]
libc = "0.2"
