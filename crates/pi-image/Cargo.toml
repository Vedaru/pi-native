[package]
name = "pi-image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native image decode/resize/encode for `read` attachments (fast_image_resize)"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
kamadak-exif = "0.6"
fast_image_resize = { version = "6", features = ["image"] }
jpeg-decoder = { version = "0.3", default-features = false }
png = { version = "0.18", default-features = false }

# `malloc_trim` after a decode returns the transient to the OS.
[target.'cfg(all(unix, target_env = "gnu"))'.dependencies]
libc = "0.2"
